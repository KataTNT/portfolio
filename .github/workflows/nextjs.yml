name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write  # required for uploading SARIF results

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  # ── 1. Dependency audit ────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Audit dependencies
        # Fails on high/critical CVEs; remove --audit-level to catch all
        run: pnpm audit --audit-level=high --prod

  # ── 2. Secret scanning ────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. SAST — static code analysis ───────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          # Results appear in GitHub Security → Code scanning alerts

  # ── 4. Build ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [audit, secret-scan, sast]  # all security gates must pass first
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # ── 5. SCA — scan the built output for known vulns ───────────────────────
  scan-output:
    name: SCA (Trivy)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ./out-artifact

      - name: Run Trivy on output
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./out-artifact
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"   # fail on findings; set to "0" to warn only

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── 6. Deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: scan-output
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5